<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dealer TV</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- TV TEMPLATE -->
        <section class="tv-template">

            <!-- HEADER -->
            <header class="top-bar">
                <div class="brand">
                    <div class="kia-logo">KIA</div>
                    <div class="dealer-name">BONIFACE HIERS KIA</div>
                </div>

                <div class="warranty">
                    WARRANTY<br>
                    <strong>FOREVER</strong>
                </div>
            </header>


            <!-- MAIN CONTENT -->
            <div class="main-content">

                <!-- VIDEO -->
                <div class="video-area">

                    <video
                        id="vehicleVideo"
                        autoplay
                        muted
                        playsinline
                    >
                        <!-- Video URL will go here later -->
                    </video>

                    <div class="video-overlay">
                        <div class="headline">
                            Adventure Looks Good On You.
                        </div>
                    </div>

                </div>


                <!-- INFORMATION PANEL -->
                <aside class="info-panel">

                    <div class="vehicle-name">
                        2026 KIA K4
                    </div>

                    <div class="tagline">
                        BUILT FOR A BRIGHTER TOMORROW
                    </div>

                    <div class="offer-box">

                        <div class="offer-label">
                            THIS MONTH'S SPECIAL
                        </div>

                        <div class="offer">
                            0% APR
                        </div>

                        <div class="offer-sub">
                            FOR 60 MONTHS
                        </div>

                        <div class="fine-print">
                            On approved credit. See dealer for details.
                        </div>

                    </div>

                </aside>

            </div>


            <!-- FEATURES -->
            <div class="features">

                <div class="feature">
                    <span>◆</span>
                    <strong>ADVANCED</strong>
                    <small>TECHNOLOGY</small>
                </div>

                <div class="feature">
                    <span>◆</span>
                    <strong>SMART</strong>
                    <small>SAFETY</small>
                </div>

                <div class="feature">
                    <span>◆</span>
                    <strong>SPACIOUS</strong>
                    <small>COMFORT</small>
                </div>

                <div class="feature">
                    <span>◆</span>
                    <strong>MODERN</strong>
                    <small>DESIGN</small>
                </div>

            </div>

        </section>

    </main>

    <script src="content.js"></script>
    <script src="app.js"></script>

</body>
</html>
